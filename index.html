<!--
    Pluto Explorer (kinda rough version)
    I didn’t really aim for perfection here — just wanted something that works and looks decent.
-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pluto Explorer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<script src="/sail/baremux/index.js" defer></script>
<script src="/sail/scram/scramjet.all.js" defer></script>

<style>
/* Colors — might tweak later honestly */
:root {
    --accent: #00ffcc;
    --bg: #050505;
    --glass: rgba(18,18,18,0.85);
    --border: rgba(255,255,255,0.08);
}

* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: #fff;
    overflow: hidden; /* prevents scroll weirdness */
}

/* Sidebar (this part took longer than expected...) */
.sidebar {
    position: fixed;
    left: -260px; /* hidden by default */
    top: 0;
    width: 260px;
    height: 100%;
    background: var(--glass);
    backdrop-filter: blur(16px);
    border-right: 1px solid var(--border);
    padding: 20px;
    transition: all 0.3s ease; /* might be overkill */
    z-index: 100;
}

.sidebar.open {
    left: 0;
}

.sidebar h2 {
    font-size: 0.75rem;
    color: #777;
    letter-spacing: 2px;
    margin-bottom: 20px;
}

.sidebar button {
    width: 100%;
    margin-bottom: 10px;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: #aaa;
    cursor: pointer;
}

.sidebar button:hover {
    background: rgba(255,255,255,0.05);
    color: var(--accent);
}

/* menu button */
.menu-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 120;
}

/* main landing thing */
.hero {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    transition: 0.3s;
}

.hero h1 {
    font-size: 3rem;
    letter-spacing: 10px;
    font-weight: 300;
}

/* search bar */
.search {
    display: flex;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 5px 10px;
    width: min(500px, 90%);
}

.search input {
    flex: 1;
    background: none;
    border: none;
    color: white;
    outline: none;
    padding: 10px;
}

.search button {
    background: var(--accent);
    border: none;
    border-radius: 30px;
    padding: 10px 20px;
    cursor: pointer;
}

/* iframe view */
iframe {
    position: absolute;
    inset: 0;
    border: none;
    opacity: 0;
    transition: opacity 0.4s;
}

body.active iframe {
    opacity: 1;
}

body.active .hero {
    opacity: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<button class="menu-btn" onclick="uiStuff.toggleSidebar()">☰</button>

<div class="sidebar" id="sidebar">
    <h2>Navigation</h2>

    <!-- quick links (could make dynamic later?) -->
    <button onclick="browserStuff.goHome()">🏠 Home</button>
    <button onclick="browserStuff.open('https://youtube.com')">YouTube</button>
    <button onclick="browserStuff.open('https://discord.com')">Discord</button>
    <button onclick="browserStuff.open('https://poki.com')">Games</button>

    <h2>Start Page</h2>
    <button onclick="settingsStuff.setHome('about:blank')">Blank</button>
    <button onclick="settingsStuff.setHome('https://google.com')">Google</button>

    <div style="margin-top:auto;">
        <button onclick="uiStuff.fullscreen()">Fullscreen</button>
    </div>
</div>

<div class="hero">
    <h1>PLUTO</h1>

    <div class="search">
        <input id="urlInput" placeholder="Search or enter URL">
        <button onclick="browserStuff.open()">Go</button>
    </div>
</div>

<iframe id="view"></iframe>

<script>
/*
    Pluto Explorer logic
    Honestly this evolved kinda randomly — might refactor later.
*/

let appState = {
    proxyInstance: null,
    isReady: false,
    homePage: localStorage.getItem("pluto_home") || "about:blank"
};

// --- boot sequence ---
window.addEventListener("load", async () => {

    // doing these in order just to be safe
    await setupSW();
    await waitForStuff();
    await setupProxy();

    // default load
    browserStuff.goHome();
});

// --- setup stuff ---
async function setupSW() {
    if (!navigator.serviceWorker) {
        // meh, not supported
        return;
    }

    try {
        await navigator.serviceWorker.register("/sail/sw.js", {
            scope: "/sail/go/"
        });
    } catch (err) {
        console.log("service worker failed... but whatever", err);
    }
}

// waits for external libs (kind of hacky but works)
function waitForStuff() {
    return new Promise(resolve => {

        let check = setInterval(() => {

            if (window.BareMux && window.$scramjetLoadController) {
                clearInterval(check);
                resolve();
            }

        }, 100);

    });
}

async function setupProxy() {
    try {
        const connection = new BareMux.BareMuxConnection("/sail/baremux/worker.js");

        await connection.setTransport("/sail/libcurl/index.mjs", [
            { websocket: "wss://wisp.rhw.one/" }
        ]);

        const { ScramjetController } = $scramjetLoadController();

        appState.proxyInstance = new ScramjetController({
            prefix: "/sail/go/",
            files: {
                all: "/sail/scram/scramjet.all.js",
                wasm: "/sail/scram/scramjet.wasm.wasm",
                sync: "/sail/scram/scramjet.sync.js"
            }
        });

        await appState.proxyInstance.init();

        appState.isReady = true;

        console.log("Proxy is ready 👍");

    } catch (e) {
        console.error("Proxy setup failed:", e);
    }
}

// --- browser controls ---
const browserStuff = {

    async open(inputVal) {

        // grab from input if nothing passed
        let raw = inputVal || document.getElementById("urlInput").value;

        if (!raw) return;

        raw = raw.trim();

        if (!appState.isReady) {
            alert("still loading, give it a sec...");
            return;
        }

        let finalUrl = this.parseInput(raw);

        document.body.classList.add("active");

        try {
            let encodedUrl = await appState.proxyInstance.encodeUrl(finalUrl);

            // small redundancy (I forgot why I added this lol)
            if (encodedUrl) {
                view.src = encodedUrl;
            } else {
                view.src = finalUrl;
            }

        } catch (err) {
            console.warn("encoding failed, fallback", err);
            view.src = finalUrl;
        }
    },

    parseInput(val) {

        if (val === "about:blank") return val;

        // quick search fallback
        if (!val.includes(".")) {
            return "https://duckduckgo.com/?q=" + encodeURIComponent(val);
        }

        // lazy protocol fix
        if (!val.startsWith("http")) {
            val = "https://" + val;
        }

        return val;
    },

    goHome() {
        document.body.classList.remove("active");

        view.src = appState.homePage;

        // reset input (not super necessary but feels cleaner)
        document.getElementById("urlInput").value = "";

        uiStuff.closeSidebar();
    }
};

// --- settings ---
const settingsStuff = {

    setHome(url) {
        appState.homePage = url;

        // saving locally
        localStorage.setItem("pluto_home", url);

        browserStuff.goHome();
    }

};

// --- UI stuff ---
const uiStuff = {

    toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("open");
    },

    closeSidebar() {
        document.getElementById("sidebar").classList.remove("open");
    },

    fullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    }

};

// --- input handling ---
document.getElementById("urlInput").addEventListener("keydown", function(e) {

    if (e.key === "Enter") {
        browserStuff.open();
    }

    // thought about adding history here... maybe later
});

// random idea I didn’t finish
// function saveHistory(url) {
//     console.log("todo");
// }
</script>

</body>
</html>
