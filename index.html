<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pluto | Explorer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />

    <script src="/sail/baremux/index.js" defer></script>
    <script src="/sail/scram/scramjet.all.js" defer></script>

    <style>
        :root {
            --accent: #aa00ff;
            --accent-glow: rgba(170, 0, 255, 0.35);
            --accent-glow-strong: rgba(170, 0, 255, 0.15);
            --bg: #010003;
            --glass: rgba(30, 10, 50, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --sidebar-width: 280px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Starfield Canvas */
        #starfield {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        /* Glow around the planet */
        .pluto-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, var(--accent-glow) 0%, transparent 70%);
            filter: blur(30px);
            opacity: 0.8;
            z-index: -1;
            transition: opacity 1s ease;
        }

        /* Spinable Pluto Container */
        .pluto-viewport {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            perspective: 1200px;
            z-index: 0;
            cursor: grab;
            transition: opacity 1s ease;
        }

        .pluto-viewport:active {
            cursor: grabbing;
        }

        .pluto-bg {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            position: relative;
            background:
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.12) 0%, transparent 70%),
                url('https://www.transparenttextures.com/patterns/rocky-wall.png'),
                linear-gradient(90deg, #2a1f19 0%, #5e4d44 20%, #b39a8b 50%, #5e4d44 80%, #2a1f19 100%);
            background-size: 200% 100%;
            box-shadow:
                inset -40px -20px 60px #000,
                inset 10px 10px 40px rgba(255,255,255,0.07),
                0 0 120px var(--accent-glow),
                0 0 40px rgba(170, 0, 255, 0.2);
            opacity: 0.3;
            animation: plutoRotate 60s linear infinite;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        @keyframes plutoRotate {
            from { background-position: 0% 0%; }
            to { background-position: 200% 0%; }
        }

        /* Sidebar and overlay */
        .sidebar {
            position: fixed;
            left: calc(var(--sidebar-width) * -1);
            top: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            transition: var(--transition);
            padding: 40px 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-left: 1px solid rgba(255, 255, 255, 0.02);
        }

        .sidebar.open {
            left: 0;
            box-shadow:
                20px 0 50px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(170, 0, 255, 0.1);
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
            z-index: 90;
        }

        .sidebar.open ~ .overlay {
            opacity: 1;
            pointer-events: all;
        }

        .side-link {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 12px;
            color: #aaa;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            transition: 0.2s ease;
            position: relative;
        }

        .side-link:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent);
            border-color: var(--border);
            box-shadow: 0 0 0 1px rgba(170, 0, 255, 0.15);
        }

        .side-link::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 12px;
            background: radial-gradient(
                circle at 20% 20%,
                rgba(170, 0, 255, 0.15),
                transparent 70%
            );
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .side-link:hover::before {
            opacity: 1;
        }

        .menu-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 130;
            background: var(--glass);
            border: 1px solid var(--border);
            color: white;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .menu-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(170, 0, 255, 0.2);
        }

        .hero {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            height: 100vh;
            transition: var(--transition);
            z-index: 10;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 300;
            letter-spacing: 15px;
            text-transform: uppercase;
            margin-bottom: 30px;
            background: linear-gradient(180deg, #fff, #666, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.3),
                0 0 40px rgba(170, 0, 255, 0.15);
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 8px 8px 8px 24px;
            border-radius: 50px;
            width: min(550px, 90vw);
            box-shadow: 0 0 20px rgba(170, 0, 255, 0.1);
            transition: box-shadow 0.2s ease;
        }

        .search-wrapper:focus-within {
            box-shadow: 0 0 30px rgba(170, 0, 255, 0.2), 0 0 10px rgba(170, 0, 255, 0.15);
        }

        input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: white;
            font-size: 1.1rem;
            padding: 8px 0;
        }

        .go-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 15px rgba(170, 0, 255, 0.3);
        }

        .go-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 25px rgba(170, 0, 255, 0.4);
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 5;
        }

        body.browsing iframe {
            opacity: 1;
            pointer-events: all;
        }

        body.browsing .hero,
        body.browsing .pluto-viewport,
        body.browsing .pluto-glow {
            opacity: 0.05;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <canvas id="starfield"></canvas>

    <div class="pluto-glow"></div>

    <div class="pluto-viewport" id="plutoContainer">
        <div class="pluto-bg" id="plutoPlanet"></div>
    </div>

    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

    <div class="sidebar" id="sidebar">
        <h2>Navigation</h2>
        <button class="side-link" onclick="goHome()">🏠 Home</button>
        <button class="side-link" onclick="nav('https://youtube.com')">📺 YouTube</button>
        <button class="side-link" onclick="nav('https://discord.com')">💬 Discord</button>
        <button class="side-link" onclick="nav('https://poki.com')">🎮 Games</button>
        <div style="margin-top: auto;">
            <button class="side-link" onclick="toggleFullScreen()">🖥️ Fullscreen</button>
        </div>
    </div>

    <div class="overlay" onclick="toggleSidebar()"></div>

    <div class="hero">
        <h1>pluto</h1>
        <div class="search-wrapper">
            <input id="bar" placeholder="Explore the cosmos..." autocomplete="off" />
            <button class="go-btn" onclick="nav()">Go</button>
        </div>
    </div>

    <iframe id="frame"></iframe>

    <script>
        // --- STARFIELD LOGIC ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.5,
                    speed: Math.random() * 0.2
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "white";
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
                s.x -= s.speed;
                if (s.x < 0) s.x = canvas.width;
            });
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', initStars);
        initStars();
        drawStars();

        // --- PLUTO SPIN LOGIC ---
        const pluto = document.getElementById('plutoPlanet');
        const container = document.getElementById('plutoContainer');
        let isDragging = false;
        let startX;
        let bgOffset = 0;

        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.pageX;
            pluto.style.animation = 'none'; // Pause auto-spin
            container.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const delta = (e.pageX - startX) * 0.2;
            bgOffset += delta;
            pluto.style.backgroundPosition = `${bgOffset}px 0%`;
            startX = e.pageX;
        });

        window.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;
            container.style.cursor = 'grab';
            // Resume slow drift
            pluto.style.animation = 'plutoRotate 120s linear infinite';
        });

        // --- TOUCH SUPPORT (optional) ---
        container.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDragging = true;
            startX = e.touches[0].clientX;
            pluto.style.animation = 'none';
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const delta = (e.touches[0].clientX - startX) * 0.2;
            bgOffset += delta;
            pluto.style.backgroundPosition = `${bgOffset}px 0%`;
            startX = e.touches[0].clientX;
        });

        window.addEventListener('touchend', () => {
            isDragging = false;
            pluto.style.animation = 'plutoRotate 120s linear infinite';
        });

        // --- PROXY & NAVIGATION LOGIC ---
        // (Keep your existing Scramjet/BareMux logic here)
        let scramjet = null;
        let isReady = false;

        async function nav(input) {
            const bar = document.getElementById('bar');
            let url = (input || bar.value).trim();
            if (!url) return;
            
            document.body.classList.add('browsing');
            // Mocking the navigation for demo; replace with your actual scramjet.encodeUrl logic
            document.getElementById('frame').src = url.includes('.') ? (url.startsWith('http') ? url : 'https://' + url) : 'https://duckduckgo.com/?q=' + url;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function goHome() { 
            document.body.classList.remove('browsing');
            document.getElementById('frame').src = 'about:blank';
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
