<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sail - Scramjet</title>
    <script src="/sail/baremux/index.js"></script>
    <script src="/sail/scram/scramjet.all.js"></script>
    <script>
        navigator.serviceWorker.register("/sail/sw.js")
    </script>
    <style>
        :root {
            color-scheme: dark;
            --bg: #050816;
            --bg-elevated: rgba(15, 23, 42, 0.9);
            --accent: #3b82f6;
            --accent-soft: rgba(59, 130, 246, 0.2);
            --text: #e5e7eb;
            --muted: #6b7280;
            --radius: 0.75rem;
            --border: rgba(148, 163, 184, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
                "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #1d4ed8 0, transparent 50%),
                radial-gradient(circle at bottom right, #22c55e 0, transparent 50%),
                var(--bg);
            color: var(--text);
            display: flex;
            align-items: stretch;
            justify-content: center;
        }

        .shell {
            width: 100%;
            max-width: 1200px;
            margin: 1rem;
            border-radius: 1.25rem;
            background: linear-gradient(135deg, rgba(15,23,42,0.95), rgba(15,23,42,0.85));
            box-shadow:
                0 24px 60px rgba(15, 23, 42, 0.85),
                0 0 0 1px rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(24px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid rgba(15, 23, 42, 0.9);
            background: linear-gradient(135deg, rgba(15,23,42,0.95), rgba(15,23,42,0.8));
        }

        .traffic-lights {
            display: flex;
            gap: 0.4rem;
            margin-right: 0.5rem;
        }

        .traffic-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            border: 1px solid rgba(15,23,42,0.9);
        }

        .traffic-dot.red    { background: #f97373; }
        .traffic-dot.yellow { background: #facc15; }
        .traffic-dot.green  { background: #4ade80; }

        .brand {
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--muted);
            margin-right: 0.75rem;
            white-space: nowrap;
        }

        .address-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .address-input {
            width: 100%;
            padding: 0.55rem 3.25rem 0.55rem 2.35rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(15,23,42,0.7));
            box-shadow:
                0 0 0 1px rgba(15, 23, 42, 0.9),
                0 14px 30px rgba(15, 23, 42, 0.9);
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition:
                border-color 140ms ease,
                box-shadow 140ms ease,
                background 140ms ease,
                transform 140ms ease;
        }

        .address-input::placeholder {
            color: var(--muted);
        }

        .address-input:focus {
            border-color: rgba(56, 189, 248, 0.9);
            box-shadow:
                0 0 0 1px rgba(56,189,248,0.8),
                0 18px 40px rgba(15,23,42,0.95);
            background: radial-gradient(circle at top left,
                        rgba(59,130,246,0.25),
                        rgba(15,23,42,0.96));
            transform: translateY(-0.5px);
        }

        .address-prefix {
            position: absolute;
            left: 0.95rem;
            font-size: 0.78rem;
            color: var(--muted);
            pointer-events: none;
            text-transform: lowercase;
        }

        .go-button {
            position: absolute;
            right: 0.25rem;
            padding: 0.3rem 0.9rem;
            border-radius: 999px;
            border: none;
            background: radial-gradient(circle at top left, #38bdf8, #2563eb);
            color: white;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            box-shadow:
                0 0 0 1px rgba(15,23,42,0.6),
                0 12px 32px rgba(37, 99, 235, 0.55);
            transform: translateY(0);
            transition:
                transform 120ms ease,
                box-shadow 120ms ease,
                filter 120ms ease,
                background 120ms ease;
        }

        .go-button:hover {
            filter: brightness(1.05);
            transform: translateY(-0.5px);
            box-shadow:
                0 0 0 1px rgba(59,130,246,0.8),
                0 16px 42px rgba(30, 64, 175, 0.85);
        }

        .go-button:active {
            transform: translateY(1px) scale(0.99);
            box-shadow:
                0 0 0 1px rgba(15,23,42,0.9),
                0 6px 18px rgba(15,23,42,0.9);
        }

        .go-icon {
            width: 13px;
            height: 13px;
            border-radius: 999px;
            border: 1px solid rgba(15, 23, 42, 0.75);
            background: rgba(248, 250, 252, 0.96);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            color: #2563eb;
        }

        .status-chip {
            margin-left: 0.4rem;
            font-size: 0.7rem;
            padding: 0.22rem 0.55rem;
            border-radius: 999px;
            border: 1px solid rgba(45, 212, 191, 0.35);
            color: #a5f3fc;
            background: radial-gradient(circle at top left,
                        rgba(45,212,191,0.2),
                        rgba(15,23,42,0.9));
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            white-space: nowrap;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: #22c55e;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.7);
        }

        .frame-wrap {
            position: relative;
            flex: 1;
            border-top: 1px solid rgba(15, 23, 42, 0.8);
            background:
                radial-gradient(ellipse at top, rgba(15,23,42,0.9), transparent 55%),
                radial-gradient(ellipse at bottom, rgba(15,23,42,0.9), transparent 55%),
                #020617;
            overflow: hidden;
        }

        .frame-wrap::before {
            content: "";
            position: absolute;
            inset: -40%;
            background:
                radial-gradient(circle at 15% 10%, rgba(59,130,246,0.12), transparent 60%),
                radial-gradient(circle at 85% 85%, rgba(45,212,191,0.12), transparent 60%),
                radial-gradient(circle at 80% 15%, rgba(244,63,94,0.08), transparent 60%);
            opacity: 0.75;
            pointer-events: none;
        }

        iframe {
            position: relative;
            z-index: 1;
            border: none;
            width: 100%;
            height: 100%;
            background: #020617;
            border-radius: 0;
        }

        @media (max-width: 640px) {
            .shell {
                margin: 0.5rem;
                border-radius: 1rem;
            }
            .topbar {
                padding-inline: 0.7rem;
                gap: 0.5rem;
            }
            .brand {
                display: none;
            }
            .status-chip {
                display: none;
            }
            .address-input {
                padding-inline-start: 2.1rem;
            }
            .go-button span.label {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="topbar">
            <div class="traffic-lights">
                <span class="traffic-dot red"></span>
                <span class="traffic-dot yellow"></span>
                <span class="traffic-dot green"></span>
            </div>

            <div class="brand">Sail · Scramjet</div>

            <div class="address-wrapper">
                <span class="address-prefix">https://</span>
                <input
                    type="text"
                    placeholder="Enter URL or search with Brave"
                    id="bar"
                    class="address-input"
                    autocomplete="off"
                    spellcheck="false"
                />
                <button class="go-button" onclick="nav()">
                    <span class="go-icon">↗</span>
                    <span class="label">Go</span>
                </button>
            </div>

            <div class="status-chip">
                <span class="status-dot"></span>
                <span>libcurl · wisp</span>
            </div>
        </div>

        <div class="frame-wrap">
            <iframe src="" id="frame"></iframe>
        </div>
    </div>

    <script>
        const connection = new BareMux.BareMuxConnection("/sail/baremux/worker.js");
        connection.setTransport("/sail/libcurl/index.mjs", [{ websocket: "wss://wisp.rhw.one/" }]);

        const frame = document.getElementById("frame");
        const bar = document.getElementById("bar");

        const { ScramjetController } = $scramjetLoadController();
        const scramjet = new ScramjetController({
            files: {
                all: "/sail/scram/scramjet.all.js",
                wasm: "/sail/scram/scramjet.wasm.wasm",
                sync: "/sail/scram/scramjet.sync.js"
            },
            prefix: "/sail/go/"
        });
        scramjet.init();

        function nav() {
            let url = bar.value.trim();
            if (!url) return;

            if (!url.includes(".")) {
                url = "https://search.duckduckgo.com/search?q=" + encodeURIComponent(url);
            } else if (!url.startsWith("http://") && !url.startsWith("https://")) {
                url = "https://" + url;
            }

            frame.src = scramjet.encodeUrl(url);
        }

        bar.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                nav();
            }
        });
    </script>
</body>
</html>
