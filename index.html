<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sail - Scramjet</title>
    
    <script src="/sail/baremux/index.js"></script>
    <script src="/sail/scram/scramjet.all.js"></script>
    <script>navigator.serviceWorker.register("/sail/sw.js")</script>

    <style>
        /* Global & Background */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #050505;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            cursor: none;
        }

        .background-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Glassmorphism UI Bar */
        .nav-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(255, 210, 150, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 210, 150, 0.2);
            border-radius: 50px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 100;
            width: min(750px, 95vw); /* Widened to fit new buttons */
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Fullscreen Hide Class */
        .nav-hidden {
            top: -100px;
            opacity: 0;
            pointer-events: none;
        }

        .nav-container:focus-within {
            border-color: rgba(255, 210, 150, 0.5);
        }

        #bar {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f5d7a1;
            font-size: 16px;
            padding: 5px 10px;
            min-width: 0; /* Prevents flex items from overflowing */
        }

        #bar::placeholder {
            color: rgba(245, 215, 161, 0.4);
        }

        .nav-btn {
            background: rgba(255, 210, 150, 0.1);
            border: 1px solid rgba(255, 210, 150, 0.2);
            color: #f5d7a1;
            border-radius: 25px;
            padding: 6px 18px;
            cursor: none;
            transition: all 0.2s ease;
            font-weight: 600;
            white-space: nowrap;
            font-size: 14px;
        }

        .nav-btn:hover {
            background: rgba(255, 210, 150, 0.2);
            transform: scale(1.05);
            border-color: rgba(255, 210, 150, 0.4);
        }

        /* Iframe Styles */
        #frame {
            height: 100vh;
            width: 100vw;
            background: #111;
            border: none;
            display: block;
        }

        /* Custom cursor */
        .cursor {
            position: fixed;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #f5d7a1, #caa06a, #8a6a45, #4e3b28);
            box-shadow: 0 0 10px rgba(255, 210, 150, 0.4);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            will-change: transform;
        }

        .cursor::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            filter: blur(1px);
        }
    </style>
</head>
<body>

    <canvas class="background-canvas" id="particleCanvas"></canvas>
    <div class="cursor" id="customCursor"></div>

    <div class="nav-container" id="navBar">
        <input type="text" placeholder="Explore the galaxy..." id="bar" autocomplete="off">
        <button class="nav-btn" onclick="nav()">Go</button>
        <button class="nav-btn" onclick="openGames()">Games</button>
        <button class="nav-btn" onclick="toggleFullScreen()">Full Screen</button>
    </div>

    <iframe id="frame"></iframe>

    <script>
        /* --- Scramjet & Logic --- */
        const connection = new BareMux.BareMuxConnection("/sail/baremux/worker.js")
        connection.setTransport("/sail/libcurl/index.mjs", [{ websocket: "wss://wisp.rhw.one/" }])

        const frame = document.getElementById("frame")
        const bar = document.getElementById("bar")
        const navBar = document.getElementById("navBar")

        const { ScramjetController } = $scramjetLoadController()
        const scramjet = new ScramjetController({
            files: {
                all: "/sail/scram/scramjet.all.js",
                wasm: "/sail/scram/scramjet.wasm.wasm",
                sync: "/sail/scram/scramjet.sync.js"
            },
            prefix: "/sail/go/"
        })
        scramjet.init()

        function nav(customUrl) {
            let url = customUrl || bar.value.trim()
            if (!url) return;

            if (!url.includes(".")) {
                url = "https://search.duckduckgo.com/search?q=" + encodeURIComponent(url)
            } else if (!url.startsWith("http://") && !url.startsWith("https://")) {
                url = "https://" + url
            }

            try {
                frame.src = scramjet.encodeUrl(url)
            } catch (err) {
                console.warn("Encoding failed, attempting direct load:", err)
                frame.src = url
            }
            bar.blur();
        }

        /* --- Custom Button Logic --- */
        function openGames() {
            // You can change this to any game site you prefer
            nav("https://poki.com");
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable full-screen mode: ${err.message}`);
                });
                navBar.classList.add('nav-hidden');
            } else {
                document.exitFullscreen();
                navBar.classList.remove('nav-hidden');
            }
        }

        // Ensure buttons return if user exits fullscreen with 'Esc' key
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                navBar.classList.remove('nav-hidden');
            }
        });

        bar.addEventListener("keydown", (e) => { if (e.key === "Enter") nav() })

    </script>
</body>
</html>
