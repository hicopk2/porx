<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pluto | Explorer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <script src="/sail/baremux/index.js" defer></script>
    <script src="/sail/scram/scramjet.all.js" defer></script>

    <style>
        :root {
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.3);
            --bg: #050505;
            --glass: rgba(18, 18, 18, 0.8);
            --border: rgba(255, 255, 255, 0.08);
            --sidebar-width: 280px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .sidebar {
            position: fixed;
            left: calc(var(--sidebar-width) * -1);
            top: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            transition: var(--transition);
            padding: 40px 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar.open {
            left: 0;
            box-shadow: 20px 0 50px rgba(0,0,0,0.5);
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
            z-index: 90;
        }

        .sidebar.open ~ .overlay {
            opacity: 1;
            pointer-events: all;
        }

        .sidebar h2 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #666;
            margin-bottom: 20px;
            padding-left: 10px;
        }

        .side-link {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 12px;
            color: #aaa;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .side-link:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent);
            border-color: var(--border);
        }

        .menu-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 130;
            background: var(--glass);
            border: 1px solid var(--border);
            color: white;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .menu-toggle:hover {
            background: rgba(255,255,255,0.1);
        }

        .hero {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            flex-direction: column;
            transition: var(--transition);
            z-index: 10;
            padding: 16px;
            box-sizing: border-box;
        }

        .hero-inner {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 0;
            margin-top: 0;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 12px;
            text-transform: uppercase;
            margin-bottom: 22px;
            background: linear-gradient(to bottom, #fff, #666);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 6px 6px 6px 20px;
            border-radius: 50px;
            width: min(500px, 85vw);
            transition: 0.3s;
        }

        .search-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: white;
            font-size: 1rem;
            padding: 10px 0;
        }

        .go-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .go-btn:hover {
            transform: scale(1.05);
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        body.browsing iframe {
            opacity: 1;
            pointer-events: all;
        }

        body.browsing .hero {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9);
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

    <div class="sidebar" id="sidebar">
        <h2>Navigation</h2>
        <button class="side-link" onclick="goHome()">🏠 Home</button>
        <button class="side-link" onclick="nav('https://youtube.com')">📺 YouTube</button>
        <button class="side-link" onclick="nav('https://discord.com')">💬 Discord</button>
        <button class="side-link" onclick="nav('https://poki.com')">🎮 Games</button>
        <button class="side-link" onclick="nav('https://open.spotify.com/')">Music</button>
        <button class="side-link" onclick="setHome('about:blank')">⚪ Blank start</button>
        <button class="side-link" onclick="setHome('https://google.com')">🌐 Google start</button>
        <!-- "new tab" style button that opens about:blank -->
        <button class="side-link" onclick="nav('about:blank')">
            🖼️ New blank page
        </button>
        <div style="margin-top: auto;">
            <button class="side-link" onclick="toggleFullScreen()">🖥️ Fullscreen</button>
        </div>
    </div>

    <div class="overlay" onclick="toggleSidebar()"></div>

    <div class="hero">
        <div class="hero-inner">
            <h1>pluto</h1>
            <div class="search-wrapper">
                <div class="loading-spinner" id="spinner"></div>
                <input id="bar" placeholder="Enter URL or search queries..." autocomplete="off" />
                <button class="go-btn" onclick="nav()">Go</button>
            </div>
        </div>
    </div>

    <iframe id="frame"></iframe>

    <script>
        let scramjet = null;
        let isReady = false;

        // this is your “about:blank in settings” setting
        let homePage = 'about:blank';

        function setHome(url) {
            homePage = url;
            goHome();
        }

        window.addEventListener('load', async () => {
            if ('serviceWorker' in navigator) {
                try {
                    await navigator.serviceWorker.register('/sail/sw.js', { scope: '/sail/go/' });
                } catch(e) {
                    console.warn('SW Registration failed');
                }
            }

            const initInterval = setInterval(async () => {
                if (window.BareMux && window.$scramjetLoadController) {
                    clearInterval(initInterval);
                    await setupProxy();
                }
            }, 100);

            // load the home page on startup
            goHome();
        });

        async function setupProxy() {
            try {
                const connection = new BareMux.BareMuxConnection('/sail/baremux/worker.js');
                await connection.setTransport('/sail/libcurl/index.mjs', [{ websocket: 'wss://wisp.rhw.one/' }]);

                const { ScramjetController } = $scramjetLoadController();
                scramjet = new ScramjetController({
                    prefix: '/sail/go/',
                    files: {
                        all: '/sail/scram/scramjet.all.js',
                        wasm: '/sail/scram/scramjet.wasm.wasm',
                        sync: '/sail/scram/scramjet.sync.js'
                    }
                });

                await scramjet.init();
                isReady = true;
                console.log('Sail Proxy Service: Online');
            } catch (err) {
                console.error('Setup failed:', err);
            }
        }

        async function nav(input) {
            const bar = document.getElementById('bar');
            const spinner = document.getElementById('spinner');
            let url = (input || bar.value).trim();

            if (!url) return;
            if (!isReady) return alert('Engine is starting. Please wait a moment.');

            spinner.style.display = 'block';

            if (url === 'about:blank') {
                // pass through as-is
            } else if (!url.includes('.')) {
                url = 'https://www.duckduckgo.com/search?q=' + encodeURIComponent(url);
            } else if (!url.startsWith('http')) {
                url = 'https://' + url;
            }

            document.body.classList.add('browsing');

            try {
                const encoded = await scramjet.encodeUrl(url);
                document.getElementById('frame').src = encoded;
            } catch {
                document.getElementById('frame').src = url;
            } finally {
                spinner.style.display = 'none';
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
        }

        function goHome() {
            document.body.classList.remove('browsing');
            document.getElementById('frame').src = homePage;
            document.getElementById('bar').value = '';
            closeSidebar();
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        document.getElementById('bar').addEventListener('keydown', e => {
            if (e.key === 'Enter') nav();
        });
    </script>
</body>
</html>
