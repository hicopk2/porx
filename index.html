<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sail - Scramjet</title>
    
    <script src="/sail/baremux/index.js"></script>
    <script src="/sail/scram/scramjet.all.js"></script>
    <script>navigator.serviceWorker.register("/sail/sw.js")</script>

    <style>
        /* Global & Background */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #050505;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            cursor: none;
        }

        .background-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Glassmorphism UI Bar */
        .nav-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(255, 210, 150, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 210, 150, 0.2);
            border-radius: 50px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 100;
            width: min(600px, 90vw);
            transition: border 0.3s ease;
        }

        .nav-container:focus-within {
            border-color: rgba(255, 210, 150, 0.5);
        }

        #bar {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f5d7a1;
            font-size: 16px;
            padding: 5px 10px;
        }

        #bar::placeholder {
            color: rgba(245, 215, 161, 0.4);
        }

        .nav-btn {
            background: rgba(255, 210, 150, 0.1);
            border: 1px solid rgba(255, 210, 150, 0.2);
            color: #f5d7a1;
            border-radius: 25px;
            padding: 5px 20px;
            cursor: none;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .nav-btn:hover {
            background: rgba(255, 210, 150, 0.2);
            transform: scale(1.05);
        }

        /* Iframe Styles */
        #frame {
            height: 100vh;
            width: 100vw;
            background: #111;
            border: none;
            display: block;
        }

        /* Custom cursor */
        .cursor {
            position: fixed;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #f5d7a1, #caa06a, #8a6a45, #4e3b28);
            box-shadow: 0 0 10px rgba(255, 210, 150, 0.4);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            will-change: transform;
        }

        .cursor::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            filter: blur(1px);
        }
    </style>
</head>
<body>

    <canvas class="background-canvas" id="particleCanvas"></canvas>
    <div class="cursor" id="customCursor"></div>

    <div class="nav-container">
        <input type="text" placeholder="Explore the galaxy..." id="bar" autocomplete="off">
        <button class="nav-btn" onclick="nav()">Go</button>
    </div>

    <iframe id="frame"></iframe>

    <script>
        /* --- Scramjet & Logic --- */
        const connection = new BareMux.BareMuxConnection("/sail/baremux/worker.js")
        connection.setTransport("/sail/libcurl/index.mjs", [{ websocket: "wss://wisp.rhw.one/" }])

        const frame = document.getElementById("frame")
        const bar = document.getElementById("bar")

        const { ScramjetController } = $scramjetLoadController()
        const scramjet = new ScramjetController({
            files: {
                all: "/sail/scram/scramjet.all.js",
                wasm: "/sail/scram/scramjet.wasm.wasm",
                sync: "/sail/scram/scramjet.sync.js"
            },
            prefix: "/sail/go/"
        })
        scramjet.init()

        function nav() {
            let url = bar.value.trim()
            if (!url) return;
            if (!url.includes(".")) {
                url = "https://duckduckgo.com/?q=" + encodeURIComponent(url)
            } else if (!url.startsWith("http://") && !url.startsWith("https://")) {
                url = "https://" + url
            }
            frame.src = scramjet.encodeUrl(url)
            bar.blur(); // Focus back to iframe
        }

        bar.addEventListener("keydown", (e) => { if (e.key === "Enter") nav() })

        /* --- Particle System --- */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        const cursor = document.getElementById('customCursor');
        let mouseX = -100, mouseY = -100;

        const PARTICLE_COUNT = 150;
        let particles = [];

        class Particle {
            constructor() {
                this.init();
            }
            init() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                // Mouse Repel
                const dx = this.x - mouseX;
                const dy = this.y - mouseY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 150) {
                    this.x += dx * 0.01;
                    this.y += dy * 0.01;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fillStyle = "rgba(245, 215, 161, 0.5)";
                ctx.fill();
            }
        }

        function initParticles() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = Array.from({length: PARTICLE_COUNT}, () => new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            
            // Draw connections
            ctx.beginPath();
            ctx.strokeStyle = "rgba(245, 215, 161, 0.05)";
            for(let i=0; i<PARTICLE_COUNT; i++) {
                for(let j=i+1; j<PARTICLE_COUNT; j++) {
                    const d = Math.hypot(particles[i].x - particles[j].x, particles[i].y - particles[j].y);
                    if(d < 120) {
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                    }
                }
            }
            ctx.stroke();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', initParticles);
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
            cursor.style.left = mouseX + 'px';
            cursor.style.top = mouseY + 'px';
        });

        initParticles();
        animate();
    </script>
</body>
</html>
</body>
</html>
